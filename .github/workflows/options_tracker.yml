name: Nifty Intraday Options Tracker

on:
  schedule:
    # 09:15 AM IST -> 03:45 UTC
    - cron: '45 3 * * 1-5'
    # 09:30 AM IST to 03:15 PM IST -> 04:00 UTC to 09:45 UTC (Every 15 mins)
    - cron: '*/15 4-9 * * 1-5'
    # 03:30 PM IST -> 10:00 UTC
    - cron: '0 10 * * 1-5'
  
  # Allows you to manually run the script anytime from the GitHub "Actions" tab
  workflow_dispatch:

# Grant write permissions so GitHub Actions can commit the updated CSV back to your repo
permissions:
  contents: write

jobs:
  run-tracker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' # Speeds up execution time

      - name: Install Required Packages
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas

      - name: Execute Options Tracker Script
        env:
          # Reads secret from GitHub Repository Secrets securely
          PAYTM_JWT_TOKEN: ${{ secrets.PAYTM_JWT_TOKEN }}
        run: |
          python tracker.py

      - name: Commit and Push Updated CSV
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add nifty_15min_oi_tracker.csv
          # Commit only if there are changes to the CSV
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update 15-min OI data [skip ci]"
          git push
